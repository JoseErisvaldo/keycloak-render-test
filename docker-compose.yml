services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keycloak_app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d keycloak_app"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/keycloak_app?schema=public
      WEB_ORIGIN: http://localhost:5173
      WEB_URL: http://localhost:5173
      KEYCLOAK_REDIRECT_URI: http://localhost:3000/auth/callback
      COOKIE_SECURE: "false"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    env_file: .env
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/keycloak_app?schema=public
    command: ["npm", "run", "db:migrate:deploy", "--workspace=@keycloak-app/api"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
